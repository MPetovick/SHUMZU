<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f2a2e" />
  <meta name="description" content="Estrategia por casillas para dos jugadores con órdenes simultáneas." />
  <title>Sembrado</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="src/ui/styles.css" />
</head>
<body>
  <!-- Home -->
  <section id="screen-home" class="screen home active" aria-label="Inicio">
    <header>
      <h1>Sembrado</h1>
      <p class="lede">Conquista el tablero antes que tu rival. Los dos ordenáis a la vez y en secreto.</p>
    </header>

    <figure style="margin:0">
      <div class="clash" aria-hidden="true">
        <div class="tile mine"><span class="chip inf">♜&#xFE0E;</span></div>
        <div class="tile black"></div>
        <div class="tile foe"><span class="chip inf">♜&#xFE0E;</span></div>
      </div>
      <figcaption class="clash-caption">Si los dos enviáis la misma unidad a la misma casilla, se quema y nadie podrá tomarla.</figcaption>
    </figure>

    <nav class="menu" aria-label="Modos de juego">
      <button id="btn-continue" class="btn primary" hidden>Continuar partida</button>
      <div class="seg" role="group" aria-label="Dificultad del bot">
        <button data-level="facil" aria-pressed="false">Fácil</button>
        <button data-level="normal" aria-pressed="true">Normal</button>
      </div>
      <button id="btn-bot" class="btn primary">Jugar contra el bot</button>
      <div class="row2">
        <button id="btn-host" class="btn">Crear sala</button>
        <button id="btn-join" class="btn">Unirse</button>
      </div>
      <button id="btn-rules" class="btn quiet">Cómo se juega</button>
      <button id="btn-install" class="btn quiet" hidden>Instalar en el móvil</button>
    </nav>

    <footer>Versión <span id="version"></span>. PvP directo entre móviles con WebRTC.</footer>
  </section>

  <!-- Game -->
  <section id="screen-game" class="screen game" aria-label="Partida">
    <div class="topbar">
      <button id="btn-menu" class="icon-btn" aria-label="Menú de partida">☰</button>
      <div class="round num" id="round-label"></div>
      <div class="phase" id="phase" data-phase="plan" role="status">
        <span class="dot"></span><span id="phase-text">Planifica</span><span class="timer" id="timer"></span>
      </div>
      <button id="btn-help" class="icon-btn" aria-label="Leyenda y reglas">?</button>
    </div>

    <div class="player foe">
      <span class="swatch" aria-hidden="true"></span>
      <div class="who"><span class="name" id="foe-name">Rival</span><span class="sub" id="foe-status"></span></div>
      <div class="cells"><b class="num" id="cells-foe">0</b><span class="sub" id="share-foe"></span></div>
    </div>

    <div class="board" id="board" role="grid" aria-label="Tablero"></div>

    <div class="player me">
      <span class="swatch" aria-hidden="true"></span>
      <div class="who"><span class="name">Tú</span><span class="sub" id="me-income"></span></div>
      <div class="cells"><b class="num" id="cells-me">0</b><span class="sub" id="share-me"></span></div>
    </div>

    <div class="orders-wrap"><ol class="orders" id="orders" aria-label="Tus órdenes de esta ronda"></ol></div>

    <div class="dock">
      <div class="hint" id="hint" aria-live="polite"></div>
      <div class="tray" id="tray" role="toolbar" aria-label="Unidades y edificios"></div>
      <div class="actions">
        <div class="pips" id="pips" aria-label="Acciones usadas"></div>
        <button id="btn-confirm" class="btn primary">Confirmar jugada</button>
      </div>
    </div>
  </section>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="grab"></div>
    <div id="sheet-body"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <!-- A single classic script so the game also works when index.html is opened by double-click (file://).
       Generated from src/ with `npm run build`. -->
  <script src="app.bundle.js"></script>
</body>
</html>
