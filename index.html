<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1a16" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Blottoku">
<meta name="description" content="Blottoku — rompecabezas de reparto con restricciones tipo sudoku">
<title>Blottoku</title>
<link rel="manifest" id="manifest-link">
<style>
:root{
  --cream:#f9f4e6; --cream-2:#f3ead3;
  --paper:#fffdf6; --paper-2:#fbf6e8;
  --ink:#3d3428; --ink-2:#6f6351; --ink-3:#a89a83; --ink-4:#d4c9b3;
  --line:#e8dfc8; --line-2:#d4c9b0;
  --gold:#b8934d; --gold-2:#d4b478; --gold-bg:#f7ecd0;
  --sage:#4a6b4a; --sage-2:#7d9a7d; --sage-bg:#e8f0e6;
  --terra:#b8604c; --terra-bg:#fae8e0;
  --silver:#9ba3a8; --silver-bg:#eef1f2;
  --bronze:#a97a52; --bronze-bg:#f2e6d9;
  --sh-sm:0 1px 2px rgba(61,52,40,.05);
  --sh-md:0 2px 8px rgba(61,52,40,.07),0 1px 3px rgba(61,52,40,.05);
  --sh-lg:0 8px 24px rgba(61,52,40,.10),0 2px 6px rgba(61,52,40,.06);
  --sh-xl:0 20px 48px rgba(61,52,40,.15),0 4px 12px rgba(61,52,40,.08);
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px;
  --serif:Georgia,'Iowan Old Style','Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','Menlo','Consolas',monospace;
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);color:var(--ink);
  background:
    radial-gradient(ellipse 120% 60% at 50% -10%,#fffdf6 0%,transparent 60%),
    radial-gradient(ellipse 90% 50% at 50% 110%,#efe4c8 0%,transparent 55%),
    var(--cream);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;touch-action:manipulation;
  user-select:none;-webkit-user-select:none;position:relative;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(rgba(61,52,40,.05) 0.5px,transparent 0.5px),
    radial-gradient(rgba(61,52,40,.03) 0.5px,transparent 0.5px);
  background-size:3px 3px,7px 7px;background-position:0 0,1px 1px;opacity:.6;
}
.app{
  position:relative;z-index:1;display:flex;flex-direction:column;
  height:100%;height:100dvh;max-width:520px;margin:0 auto;
  padding-top:env(safe-area-inset-top);
  padding-left:env(safe-area-inset-left);
  padding-right:env(safe-area-inset-right);
}
.topbar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;gap:6px}
.brand{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--ink);letter-spacing:.01em;display:flex;align-items:center;gap:8px;line-height:1}
.brand .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px rgba(184,147,77,.15)}
.top-right{display:flex;gap:6px;align-items:center}
.timer{font-family:var(--mono);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;padding:5px 12px;border-radius:20px;background:var(--paper-2);box-shadow:var(--sh-sm);border:1px solid var(--line);letter-spacing:.02em;min-width:58px;text-align:center}
.icon-btn{width:38px;height:38px;border-radius:50%;background:transparent;border:1px solid var(--line-2);color:var(--ink-2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s var(--ease-spring),background .15s ease,color .15s ease,border-color .15s ease;flex-shrink:0}
.icon-btn:active{transform:scale(.9);background:var(--paper)}
.icon-btn:hover{border-color:var(--gold);color:var(--gold)}
.icon-btn.off{opacity:.4}
.icon-btn svg{pointer-events:none}
.stage{flex:1;min-height:0;display:flex;align-items:stretch;justify-content:center;padding:4px 12px 6px}
.board{flex:1;max-width:460px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 42px;grid-template-rows:22px repeat(9,minmax(0,1fr));gap:4px;transition:opacity .3s ease;position:relative}
.board.solved{opacity:.94}
.board-head{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 42px;gap:4px;align-items:center}
.col-head{display:flex;justify-content:space-between;gap:1px;padding:0 2px}
.col-head .pip{font-family:var(--mono);font-size:9px;font-weight:600;color:var(--ink-3);background:var(--cream-2);width:100%;max-width:14px;height:14px;line-height:14px;text-align:center;border-radius:4px;flex-shrink:1;min-width:0;transition:color .25s ease,background .25s ease,opacity .25s ease}
.col-head .pip.used{color:transparent;background:transparent;position:relative;opacity:.55}
.col-head .pip.used::after{content:"";position:absolute;left:15%;right:15%;top:50%;height:1.5px;background:var(--ink-3);border-radius:1px;transform:translateY(-50%)}
.cell{background:var(--paper);border:1px solid transparent;border-radius:var(--r-sm);color:var(--ink);font-family:var(--serif);font-size:clamp(18px,4.2vh,26px);font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;transition:background-color .15s ease,color .15s ease,box-shadow .15s ease,border-color .15s ease,transform .15s var(--ease-spring);display:flex;align-items:center;justify-content:center;position:relative;-webkit-user-select:none;user-select:none;min-width:0;min-height:0;padding:2px;will-change:transform;box-shadow:var(--sh-sm)}
.cell:active{transform:scale(.96)}
.cell.clue{background:var(--gold-bg);color:var(--gold);font-weight:600;box-shadow:inset 0 0 0 1px rgba(184,147,77,.15),var(--sh-sm);cursor:default}
.cell.clue:active{transform:none}
.cell.filled{background:var(--sage-bg);color:var(--sage);font-weight:600;box-shadow:inset 0 0 0 1px rgba(74,107,74,.14),var(--sh-sm)}
.cell.wrong{background:var(--terra-bg);color:var(--terra);font-weight:600;box-shadow:inset 0 0 0 1px rgba(184,96,76,.28),var(--sh-sm)}
.cell.selected{background:var(--paper);color:var(--gold);border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,147,77,.22),0 0 0 1px var(--gold),var(--sh-md);z-index:2;transform:scale(1.02)}
.cell.selected.clue{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,147,77,.25),var(--sh-md)}
.cell.selected.wrong{border-color:var(--terra);color:var(--terra);box-shadow:0 0 0 2px rgba(184,96,76,.25),0 0 0 1px var(--terra),var(--sh-md)}
.cell.same-row,.cell.same-col{background:rgba(247,236,208,.55)}
.cell.same-row.filled,.cell.same-col.filled{background:rgba(232,240,230,.55);color:var(--sage)}
.cell.same-row.wrong,.cell.same-col.wrong{background:rgba(250,232,224,.75);color:var(--terra)}
.cell.same-row.clue,.cell.same-col.clue{background:rgba(247,236,208,.75)}
.cell.same-digit{box-shadow:inset 0 0 0 1.5px var(--gold-2),var(--sh-sm)}
.cell.conflict{background:var(--terra-bg);color:var(--terra);box-shadow:inset 0 0 0 1px rgba(184,96,76,.3),var(--sh-sm);animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
.cell.conflict.clue{animation:none}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-3px)}40%,60%{transform:translateX(3px)}}
.cell.pop{animation:pop .35s var(--ease-spring)}
@keyframes pop{0%{transform:scale(.5);opacity:0}65%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.cell.hint-pop{animation:hintPop .9s ease}
@keyframes hintPop{0%{box-shadow:0 0 0 5px rgba(184,147,77,.55),var(--sh-sm);background:#fff;transform:scale(1.06)}40%{box-shadow:0 0 0 8px rgba(184,147,77,.20),var(--sh-sm);background:#fff;transform:scale(1.02)}100%{box-shadow:inset 0 0 0 1px rgba(184,147,77,.15),var(--sh-sm);background:var(--gold-bg);transform:scale(1)}}
.cell.clear-pop{animation:clearPop .55s ease}
@keyframes clearPop{
  0%{transform:scale(1);background:var(--paper)}
  45%{transform:scale(1.08);background:var(--terra-bg);color:var(--terra)}
  100%{transform:scale(1);background:var(--paper);color:var(--ink)}
}
.cell.wrong-pop{animation:wrongPop .8s ease}
@keyframes wrongPop{
  0%{transform:scale(1)}
  35%{transform:scale(1.12);box-shadow:0 0 0 8px rgba(184,96,76,.28),var(--sh-sm)}
  100%{transform:scale(1)}
}
.cell.notes{font-family:var(--sans);font-size:9px}
.cell .notes-grid{position:absolute;inset:2px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none;color:var(--ink-3);font-family:var(--mono);font-size:9px;font-weight:600}
.cell .notes-grid span{display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s ease}
.cell .notes-grid span.on{opacity:1}
.row-sum{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--ink-3);border-radius:999px;min-width:38px;height:22px;justify-self:end;align-self:center;padding:0 6px;background:transparent;transition:background .25s ease,color .25s ease,transform .25s var(--ease-spring)}
.row-sum.ok{background:var(--sage-bg);color:var(--sage);animation:pulseOk .5s var(--ease-spring)}
.row-sum.over{background:var(--terra-bg);color:var(--terra)}
.row-sum.under{background:var(--gold-bg);color:var(--gold)}
@keyframes pulseOk{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.bottom{flex-shrink:0;padding-bottom:calc(env(safe-area-inset-bottom) + 6px);display:flex;flex-direction:column;gap:6px}
.action-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding:0 10px}
.action-btn{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);color:var(--ink-2);font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:8px 2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:background .15s ease,color .15s ease,border-color .15s ease,transform .15s var(--ease-spring),opacity .15s ease;min-height:38px;box-shadow:var(--sh-sm);position:relative}
.action-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);background:var(--paper)}
.action-btn:active:not(:disabled){transform:scale(.96)}
.action-btn:disabled{opacity:.35;cursor:not-allowed}
.action-btn.active{background:var(--gold-bg);border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 2px rgba(184,147,77,.14),var(--sh-sm)}
.action-btn svg{flex-shrink:0;pointer-events:none}
.action-btn .badge{font-family:var(--mono);font-size:8.5px;font-weight:700;background:var(--gold-bg);color:var(--gold);border-radius:999px;padding:1px 4px;min-width:14px;text-align:center;line-height:1.1;margin-left:1px;transition:background .2s ease,color .2s ease}
.action-btn:disabled .badge{background:transparent;color:var(--ink-4);box-shadow:inset 0 0 0 1px var(--line)}
.action-btn.badge-pulse .badge{animation:badgePulse .5s var(--ease-spring)}
@keyframes badgePulse{0%{transform:scale(1)}40%{transform:scale(1.35);background:var(--gold);color:#fff}100%{transform:scale(1)}}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:0 12px}
.key{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);color:var(--ink);font-family:var(--serif);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;cursor:pointer;transition:background-color .15s ease,color .15s ease,transform .15s var(--ease-spring),border-color .15s ease,box-shadow .15s ease,opacity .2s ease;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:50px;box-shadow:var(--sh-sm);will-change:transform}
.key:hover:not(:disabled){border-color:var(--gold);background:var(--paper)}
.key:active:not(:disabled){transform:scale(.92)}
.key .count{font-family:var(--mono);font-size:9px;color:var(--ink-3);line-height:1;letter-spacing:.02em;transition:color .2s ease;margin-top:1px}
.key:disabled{opacity:.25;cursor:not-allowed;background:var(--cream-2);border-color:transparent;color:var(--ink-4);box-shadow:none;transform:none}
.key:disabled .count{color:var(--ink-4)}
.key.in-col:not(:disabled){color:var(--ink-3);background:var(--paper-2)}
.key.erase{font-family:var(--sans);color:var(--ink-2)}
.key.erase svg{width:18px;height:18px}
.key.erase:disabled{color:var(--ink-4)}
.key.flash{animation:keyFlash .35s ease}
@keyframes keyFlash{0%{background:var(--gold-bg);border-color:var(--gold);transform:scale(.95)}100%{background:var(--paper);border-color:var(--line);transform:scale(1)}}
.overlay{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(61,52,40,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;transition:opacity .25s ease}
.overlay.show{display:flex;opacity:1}
.card{background:var(--paper);border-radius:var(--r-xl);padding:26px;width:100%;max-width:380px;box-shadow:var(--sh-xl);transform:translateY(12px) scale(.97);transition:transform .4s var(--ease-spring);max-height:calc(100dvh - 40px);overflow-y:auto}
.overlay.show .card{transform:translateY(0) scale(1)}
.card h2{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--ink);letter-spacing:.01em;margin-bottom:4px;line-height:1.2}
.card .sub{font-size:13px;color:var(--ink-2);margin-bottom:18px;line-height:1.5}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.diff-btn{background:var(--paper-2);border:1.5px solid var(--line);border-radius:var(--r-md);color:var(--ink);padding:14px 10px;cursor:pointer;transition:all .18s ease;display:flex;flex-direction:column;align-items:center;gap:3px}
.diff-btn:hover{border-color:var(--gold-2);background:var(--paper)}
.diff-btn:active{transform:scale(.97)}
.diff-btn.active{background:var(--gold-bg);border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,147,77,.12)}
.diff-btn .n{font-family:var(--serif);font-size:16px;font-weight:500;color:var(--ink);line-height:1.1}
.diff-btn.active .n{color:var(--gold)}
.diff-btn .c{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.02em;text-align:center}
.diff-btn.active .c{color:var(--gold-2)}
.menu-actions{display:flex;gap:8px;margin-bottom:14px}
.btn{flex:1;border-radius:var(--r-md);padding:14px 16px;font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:.02em;cursor:pointer;transition:all .18s var(--ease-spring);border:1.5px solid transparent;min-height:48px}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--gold);color:#fff;border-color:var(--gold);box-shadow:0 4px 12px rgba(184,147,77,.28)}
.btn-primary:hover{background:#a67f3c;border-color:#a67f3c}
.btn-danger{background:var(--terra);color:#fff;border-color:var(--terra);box-shadow:0 4px 12px rgba(184,96,76,.28)}
.btn-danger:hover{background:#a04e3d;border-color:#a04e3d}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--line-2)}
.btn-ghost:hover{background:var(--paper-2);border-color:var(--line)}
.menu-foot{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px;margin-top:2px}
.menu-foot-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)}
.menu-foot a{color:var(--ink-3);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);transition:color .15s ease}
.menu-foot a:hover{color:var(--gold)}
.lang-picker{display:inline-flex;align-items:center;gap:0;padding:3px;border-radius:999px;background:var(--cream-2);border:1px solid var(--line);box-shadow:inset 0 1px 2px rgba(61,52,40,.05)}
.lang-btn{position:relative;min-width:38px;height:26px;padding:0 10px;border-radius:999px;background:transparent;border:1px solid transparent;color:var(--ink-3);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .15s var(--ease-spring);-webkit-user-select:none;user-select:none}
.lang-btn:hover{color:var(--ink);background:rgba(184,147,77,.08)}
.lang-btn:active{transform:scale(.94)}
.lang-btn.active{color:#fff;background:var(--gold);border-color:var(--gold);box-shadow:0 1px 3px rgba(184,147,77,.35),0 0 0 1px rgba(184,147,77,.20);text-shadow:0 1px 0 rgba(0,0,0,.08)}
.lang-btn.active:hover{background:#a67f3c;border-color:#a67f3c;color:#fff}
.lang-btn:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.win-card{text-align:center}
.win-icon{width:72px;height:72px;margin:0 auto 16px;border-radius:50%;background:var(--sage-bg);color:var(--sage);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(74,107,74,.08);animation:winIcon .8s var(--ease-spring) both}
@keyframes winIcon{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.win-card h2{font-size:26px;text-align:center;margin-bottom:6px}
.win-card .sub{text-align:center;margin-bottom:16px}

/* --- Medalla --- */
.win-medal{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 14px;margin:0 auto 16px;border-radius:999px;
  font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;
  animation:medalIn .6s var(--ease-spring) both;
}
@keyframes medalIn{
  0%{transform:scale(0) rotate(-90deg);opacity:0}
  60%{transform:scale(1.12) rotate(6deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.win-medal[hidden]{display:none}
.win-medal svg{width:16px;height:16px}
.win-medal.gold{background:var(--gold-bg);color:var(--gold);box-shadow:0 0 0 1px rgba(184,147,77,.30)}
.win-medal.silver{background:var(--silver-bg);color:var(--silver);box-shadow:0 0 0 1px rgba(155,163,168,.35)}
.win-medal.bronze{background:var(--bronze-bg);color:var(--bronze);box-shadow:0 0 0 1px rgba(169,122,82,.35)}

/* --- Puntuación --- */
.win-score{
  background:linear-gradient(180deg,var(--paper-2) 0%,var(--paper) 100%);
  border-radius:var(--r-lg);
  padding:16px 12px 12px;
  margin-bottom:18px;
  border:1px solid var(--line);
}
.win-score .v{
  font-family:var(--mono);font-size:38px;font-weight:700;
  color:var(--gold);font-variant-numeric:tabular-nums;
  letter-spacing:.02em;line-height:1;
  text-shadow:0 1px 0 rgba(255,255,255,.4);
}
.win-score .l{
  font-size:10px;color:var(--ink-3);text-transform:uppercase;
  letter-spacing:.10em;font-weight:700;margin-top:6px;
}
.win-score .rec{
  font-size:11px;color:var(--ink-3);margin-top:8px;letter-spacing:.02em;
  font-family:var(--mono);
}
.win-score .rec.new{
  color:var(--gold);font-weight:700;
  animation:recordPulse .8s var(--ease-spring) both;
}
@keyframes recordPulse{
  0%{transform:scale(.9);opacity:0}
  50%{transform:scale(1.06);opacity:1}
  100%{transform:scale(1);opacity:1}
}

.win-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:22px}
.win-stat{background:var(--paper-2);border-radius:var(--r-md);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.win-stat .v{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.win-stat .l{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}

.confirm-card{text-align:center;max-width:340px}
.confirm-card .warn-icon{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:var(--terra-bg);color:var(--terra);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(184,96,76,.08)}
.confirm-card h2{text-align:center}
.confirm-card .sub{text-align:center;margin-bottom:20px}
.confirm-card .menu-actions{margin-bottom:0}
.tut-list{list-style:none;margin:0 0 22px;padding:0;display:flex;flex-direction:column;gap:14px}
.tut-list li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.tut-list li b{color:var(--ink);font-weight:600}
.tut-list .n{width:26px;height:26px;border-radius:50%;background:var(--gold-bg);color:var(--gold);font-family:var(--serif);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 148px);left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--cream);padding:10px 20px;border-radius:24px;font-size:13px;font-weight:500;box-shadow:var(--sh-lg);opacity:0;transition:opacity .3s ease,transform .3s var(--ease-spring);pointer-events:none;z-index:200;max-width:88%;text-align:center;letter-spacing:.01em;line-height:1.4}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:150;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:7px;height:11px;border-radius:2px;opacity:0;animation:caer linear forwards}
@keyframes caer{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(var(--rx,360deg));opacity:0}}
@media (max-height:640px){
  .brand{font-size:20px}.timer{font-size:12px;padding:4px 10px;min-width:52px}
  .key{min-height:46px;font-size:20px;padding:6px 4px 4px}
  .action-btn{min-height:34px;font-size:10px;padding:6px 2px}
  .topbar{padding:8px 14px 4px}.board{grid-template-rows:20px repeat(9,minmax(0,1fr));gap:3px}
  .board-head{gap:3px}.cell{border-radius:6px}.cell .notes-grid{font-size:8px}
  .win-score .v{font-size:32px}
}
@media (max-height:560px){
  .key{min-height:42px;font-size:18px;padding:4px 4px 2px}.cell{font-size:17px}
  .board{gap:3px;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 36px}
  .board-head{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 36px}
  .col-head .pip{font-size:8px;height:12px;line-height:12px}
  .row-sum{font-size:10px;height:20px;min-width:34px;padding:0 5px}
}
@media (max-width:360px){
  .col-head .pip{font-size:8px}.board{padding:0 4px}.key{font-size:19px}
  .action-strip{gap:4px;padding:0 8px}
  .action-btn{font-size:9px;gap:3px;padding:6px 1px;min-height:34px}
  .action-btn svg{width:12px;height:12px}
  .action-btn .badge{font-size:7.5px;padding:0 3px;min-width:12px}
  .lang-picker{padding:2px}.lang-btn{min-width:32px;height:24px;padding:0 7px;font-size:10px;letter-spacing:.04em}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
  .cell.pop,.cell.hint-pop,.cell.clear-pop,.cell.wrong-pop,.row-sum.ok,.win-icon,.win-medal,
  .action-btn.badge-pulse .badge,.win-score .rec.new{animation:none !important}
}
@media (prefers-color-scheme: dark){
  :root{
    --cream:#1c1a16;--cream-2:#252220;--paper:#232019;--paper-2:#2b271f;
    --ink:#ebe2cf;--ink-2:#a99e88;--ink-3:#7a6f5c;--ink-4:#4a4234;
    --line:#3a3327;--line-2:#4a4234;
    --gold:#d4b478;--gold-2:#b8934d;--gold-bg:#332b1c;
    --sage:#8fae8f;--sage-2:#7d9a7d;--sage-bg:#1f2a1f;
    --terra:#d68070;--terra-bg:#2e1f1b;
    --silver:#adb5ba;--silver-bg:#282c2e;
    --bronze:#c69770;--bronze-bg:#2e251d;
    --sh-sm:0 1px 2px rgba(0,0,0,.4);
    --sh-md:0 2px 8px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
    --sh-lg:0 8px 24px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
    --sh-xl:0 20px 48px rgba(0,0,0,.7),0 4px 12px rgba(0,0,0,.5);
  }
  body{background:radial-gradient(ellipse 120% 60% at 50% -10%,#2b2620 0%,transparent 60%),radial-gradient(ellipse 90% 50% at 50% 110%,#17140e 0%,transparent 55%),var(--cream)}
  body:before{opacity:.2}
  .timer{background:rgba(212,180,120,.10);border-color:rgba(212,180,120,.28);color:var(--ink)}
  .cell.selected{background:#3a3226;color:var(--gold);border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,180,120,.30),0 0 0 1px var(--gold),0 4px 14px rgba(0,0,0,.55)}
  .cell.selected.clue{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,180,120,.35),0 4px 14px rgba(0,0,0,.55)}
  .cell.selected.wrong{border-color:var(--terra);color:var(--terra);box-shadow:0 0 0 2px rgba(214,128,112,.35),0 4px 14px rgba(0,0,0,.55)}
  .cell.same-row,.cell.same-col{background:rgba(212,180,120,.07)}
  .cell.same-row.filled,.cell.same-col.filled{background:rgba(143,174,143,.10)}
  .cell.same-row.wrong,.cell.same-col.wrong{background:rgba(214,128,112,.12);color:var(--terra)}
  .cell.same-row.clue,.cell.same-col.clue{background:rgba(212,180,120,.12)}
  .cell.wrong{background:rgba(214,128,112,.14);color:var(--terra);box-shadow:inset 0 0 0 1px rgba(214,128,112,.28),var(--sh-sm)}
  .action-btn:hover:not(:disabled),.key:hover:not(:disabled),.diff-btn:hover,.btn-ghost:hover,.lang-btn:hover{background:#2f2a20}
  .lang-picker{background:#1f1c17;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
  .lang-btn.active{color:#1c1a16;text-shadow:none}
  .lang-btn.active:hover{color:#1c1a16}
  .win-score{background:linear-gradient(180deg,#28241b 0%,#232019 100%)}
  .win-score .v{text-shadow:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>Blottoku</div>
    <div class="top-right">
      <span class="timer" id="timer">0:00</span>
      <button class="icon-btn" id="sound-btn" aria-label="Sound">
        <svg id="sound-on-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
          <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
        </svg>
        <svg id="sound-off-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="22" y1="9" x2="16" y2="15"/>
          <line x1="16" y1="9" x2="22" y2="15"/>
        </svg>
      </button>
      <button class="icon-btn" id="menu-btn" aria-label="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="board" id="board"></div>
  </main>

  <section class="bottom">
    <div class="action-strip">
      <button class="action-btn" id="undo-btn" disabled aria-label="Undo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
        </svg>
      </button>
      <button class="action-btn" id="hint-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>
        </svg>
        <span data-i18n="hint">Hint</span>
        <span class="badge" id="hint-badge">3</span>
      </button>
      <button class="action-btn" id="check-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span data-i18n="check">Check</span>
        <span class="badge" id="check-badge">3</span>
      </button>
      <button class="action-btn" id="notes-btn" aria-label="Notes mode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </button>
      <button class="action-btn" id="restart-btn" aria-label="Restart">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/>
        </svg>
      </button>
    </div>

    <div class="keypad" id="keypad"></div>
  </section>
</div>

<!-- Overlay: menú -->
<div class="overlay" id="menu-overlay">
  <div class="card">
    <h2 data-i18n="menu_title">New puzzle</h2>
    <div class="sub" data-i18n="menu_sub"></div>
    <div class="diff-grid" id="diff-grid">
      <button class="diff-btn" data-diff="facil">
        <span class="n" data-i18n="diff_easy"></span>
        <span class="c" data-diff-info="facil"></span>
      </button>
      <button class="diff-btn active" data-diff="medio">
        <span class="n" data-i18n="diff_medium"></span>
        <span class="c" data-diff-info="medio"></span>
      </button>
      <button class="diff-btn" data-diff="dificil">
        <span class="n" data-i18n="diff_hard"></span>
        <span class="c" data-diff-info="dificil"></span>
      </button>
      <button class="diff-btn" data-diff="experto">
        <span class="n" data-i18n="diff_expert"></span>
        <span class="c" data-diff-info="experto"></span>
      </button>
    </div>
    <div class="menu-actions">
      <button class="btn btn-ghost" id="menu-cancel" data-i18n="cancel"></button>
      <button class="btn btn-primary" id="menu-start" data-i18n="start"></button>
    </div>
    <div class="menu-foot">
      <div class="menu-foot-row">
        <a id="menu-help" data-i18n="how_to_play"></a>
        <div class="lang-picker" id="lang-picker" role="group" aria-label="Idioma / Language">
          <button class="lang-btn" data-lang="en" title="English" aria-label="English">EN</button>
          <button class="lang-btn" data-lang="ca" title="Català" aria-label="Català">CA</button>
          <button class="lang-btn" data-lang="es" title="Español" aria-label="Español">ES</button>
          <button class="lang-btn" data-lang="fr" title="Français" aria-label="Français">FR</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Overlay: confirmación de reinicio -->
<div class="overlay" id="confirm-overlay">
  <div class="card confirm-card">
    <div class="warn-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9"/>
        <path d="M3 3v6h6"/>
      </svg>
    </div>
    <h2 data-i18n="confirm_restart_title"></h2>
    <div class="sub" data-i18n="confirm_restart_msg"></div>
    <div class="menu-actions">
      <button class="btn btn-ghost" id="confirm-no" data-i18n="confirm_no"></button>
      <button class="btn btn-danger" id="confirm-yes" data-i18n="confirm_yes"></button>
    </div>
  </div>
</div>

<!-- Overlay: victoria -->
<div class="overlay" id="win-overlay">
  <div class="card win-card">
    <div class="win-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h2 data-i18n="solved"></h2>
    <div class="sub" id="win-sub"></div>

    <div class="win-medal" id="win-medal" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="9" r="6"/>
        <path d="M8.5 14.2 6 22l6-3 6 3-2.5-7.8"/>
      </svg>
      <span id="win-medal-label"></span>
    </div>

    <div class="win-score">
      <div class="v" id="win-score">0</div>
      <div class="l" data-i18n="score"></div>
      <div class="rec" id="win-record"></div>
    </div>

    <div class="win-stats">
      <div class="win-stat"><span class="v" id="win-time">0:00</span><span class="l" data-i18n="time"></span></div>
      <div class="win-stat"><span class="v" id="win-moves">0</span><span class="l" data-i18n="moves"></span></div>
      <div class="win-stat"><span class="v" id="win-helps">0</span><span class="l" data-i18n="helps"></span></div>
    </div>
    <button class="btn btn-primary" id="win-new" data-i18n="another_puzzle"></button>
  </div>
</div>

<!-- Overlay: tutorial -->
<div class="overlay" id="tut-overlay">
  <div class="card">
    <h2 data-i18n="tut_title"></h2>
    <div class="sub" data-i18n="tut_sub"></div>
    <ol class="tut-list">
      <li><span class="n">1</span><span data-i18n-html="tut_1"></span></li>
      <li><span class="n">2</span><span data-i18n-html="tut_2"></span></li>
      <li><span class="n">3</span><span data-i18n-html="tut_3"></span></li>
    </ol>
    <button class="btn btn-primary" id="tut-ok" data-i18n="understood"></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="core.js"></script>

const N_ROWS = BLOTTUKU.FILAS;
const N_COLS = BLOTTUKU.COLS;
const TARGET = BLOTTUKU.PRESUPUESTO;
const DIFFS = BLOTTUKU.DIFICULTADES;

const DIFF_KEY = { facil: 'diff_easy', medio: 'diff_medium', dificil: 'diff_hard', experto: 'diff_expert' };
function diffName(key) { return I18N.t(DIFF_KEY[key] || 'diff_medium'); }

/* ==========================================================================
   Puntuación
   ========================================================================== */
const SCORE = {
  HINT_PENALTY:  100,
  CHECK_PENALTY:  50,
  NO_HELP_BONUS: 1.20,   // +20 % si terminas sin usar ninguna ayuda
  calcular(diff, hints, checks) {
    const base = DIFFS[diff] ? DIFFS[diff].base : 1000;
    let s = base - this.HINT_PENALTY * hints - this.CHECK_PENALTY * checks;
    if (s < 0) s = 0;
    if (hints === 0 && checks === 0) s = Math.round(s * this.NO_HELP_BONUS);
    return s;
  },
  medalla(hints, checks) {
    const total = hints + checks;
    if (total === 0) return 'gold';
    if (total <= 2)  return 'silver';
    if (total <= 4)  return 'bronze';
    return null;
  }
};

/* ==========================================================================
   STORE
   ========================================================================== */
const STORE = {
  KEY: 'blottoku-puzzle-v19',
  SAVE_KEY: 'blottoku-save-v12',
  load() { try { return JSON.parse(localStorage.getItem(this.KEY) || '{}'); } catch (e) { return {}; } },
  save(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) {} },
  patch(o) { const d = this.load(); Object.assign(d, o); this.save(d); },
  addWin(w) {
    const d = this.load();
    if (!d.wins) d.wins = [];
    d.wins.push(w);
    if (d.wins.length > 200) d.wins = d.wins.slice(-200);
    this.save(d);
  },
  recordOf(diff) {
    const d = this.load();
    return (d.records && d.records[diff]) || 0;
  },
  saveRecord(diff, score) {
    const d = this.load();
    if (!d.records) d.records = {};
    if ((d.records[diff] || 0) < score) {
      d.records[diff] = score;
      this.save(d);
      return true;   // nuevo récord
    }
    return false;
  },
  cargarPartida() {
    try { const s = localStorage.getItem(this.SAVE_KEY); return s ? JSON.parse(s) : null; }
    catch (e) { return null; }
  },
  guardarPartida(obj) {
    try { localStorage.setItem(this.SAVE_KEY, JSON.stringify(obj)); } catch (e) {}
  },
  limpiarPartida() {
    try { localStorage.removeItem(this.SAVE_KEY); } catch (e) {}
  }
};

/* ==========================================================================
   SONIDO + HÁPTICA
   ========================================================================== */
const SOUND = (() => {
  let ctx = null, enabled = true;
  function init() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
    return ctx;
  }
  function play(freq, dur, type, vol) {
    if (!enabled) return;
    const c = init(); if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.04, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime); o.stop(c.currentTime + dur);
  }
  return {
    isOn() { return enabled; },
    toggle(v) { enabled = !!v; },
    buzz(pat) { if (!enabled) return; try { if (navigator.vibrate) navigator.vibrate(pat); } catch(e) {} },
    select() { play(880, 0.03, 'sine', 0.02); this.buzz(5); },
    place() { play(587, 0.09, 'sine', 0.05); setTimeout(() => play(880, 0.11, 'sine', 0.04), 50); this.buzz(8); },
    check() { play(740, 0.1, 'sine', 0.05); setTimeout(() => play(1109, 0.13, 'sine', 0.04), 70); this.buzz([10, 25, 10]); },
    checkRed() { play(440, 0.11, 'triangle', 0.05); setTimeout(() => play(294, 0.16, 'triangle', 0.045), 80); this.buzz([20, 40, 20]); },
    clear() { play(392, 0.09, 'sine', 0.03); this.buzz(5); },
    conflict() { play(330, 0.1, 'triangle', 0.04); setTimeout(() => play(262, 0.14, 'triangle', 0.035), 70); this.buzz([10, 25, 10]); },
    note() { play(1200, 0.025, 'sine', 0.02); },
    error() { play(185, 0.16, 'triangle', 0.05); this.buzz([10, 40, 10]); },
    hint() { play(659, 0.1, 'sine', 0.05); setTimeout(() => play(988, 0.14, 'sine', 0.04), 70); this.buzz([15, 30, 15]); },
    denied() { play(220, 0.14, 'triangle', 0.04); this.buzz([5, 30, 5]); },
    win() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => play(f, 0.25, 'sine', 0.05), i * 120)); this.buzz([40, 80, 40, 80, 120]); }
  };
})();

/* ==========================================================================
   ESTADO
   ========================================================================== */
const S = {
  grid: [],
  solution: [],
  cluesOriginales: new Set(),
  selected: null,
  history: [],
  startTime: 0,
  timerId: null,
  difficulty: 'medio',
  moves: 0,
  hints: 0,
  checks: 0,
  finished: false,
  flashDigit: null,
  notesMode: false,
  ultimoMovimiento: null,
  rojo: null
};

let _saveT = null;
function pideGuardado() {
  clearTimeout(_saveT);
  _saveT = setTimeout(guardarPartidaAhora, 400);
}
function guardarPartidaAhora() {
  if (!S.solution.length || S.finished) return;
  STORE.guardarPartida({
    difficulty: S.difficulty,
    solution: S.solution,
    grid: S.grid.map(row => row.map(cell => ({
      v: cell.v,
      clue: cell.clue,
      notes: Array.from(cell.notes || [])
    }))),
    cluesOriginales: Array.from(S.cluesOriginales),
    startTime: S.startTime,
    moves: S.moves,
    hints: S.hints,
    checks: S.checks,
    history: S.history,
    ultimoMovimiento: S.ultimoMovimiento,
    selected: S.selected,
    notesMode: S.notesMode,
    rojo: S.rojo
  });
}

/* ==========================================================================
   GAME
   ========================================================================== */
const GAME = {
  maxHints() { return DIFFS[S.difficulty].ayudas; },
  hintsLeft() { return Math.max(0, this.maxHints() - S.hints); },
  maxChecks() { return DIFFS[S.difficulty].checks; },
  checksLeft() { return Math.max(0, this.maxChecks() - S.checks); },

  nueva(diff) {
    if (diff && DIFFS[diff]) S.difficulty = diff;
    const p = BLOTTUKU.makePuzzle(S.difficulty);
    S.solution = p.solucion;
    S.cluesOriginales = new Set(p.clues);
    S.grid = BLOTTUKU.crudoAEstado(p.solucion, p.clues);
    this._inicia();
    STORE.limpiarPartida();
  },

  reiniciar() {
    if (!S.solution.length) return;
    S.grid = BLOTTUKU.crudoAEstado(S.solution, S.cluesOriginales);
    this._inicia();
    UI.toast(I18N.t('toast_clean'));
    pideGuardado();
  },

  _inicia() {
    S.selected = null;
    S.history = [];
    S.moves = 0;
    S.hints = 0;
    S.checks = 0;
    S.finished = false;
    S.startTime = Date.now();
    S.flashDigit = null;
    S.notesMode = false;
    S.ultimoMovimiento = null;
    S.rojo = null;
    if (S.timerId) clearInterval(S.timerId);
    S.timerId = setInterval(() => UI.renderTime(), 1000);
    UI.renderBoard();
    UI.renderKeypad();
    UI.renderTime();
    UI.updateUndo();
    UI.updateHintBtn();
    UI.updateCheckBtn();
    UI.syncNotesBtn();
    const b = document.getElementById('board');
    if (b) b.classList.remove('solved');
  },

  restaurar(datos) {
    S.difficulty = datos.difficulty || 'medio';
    S.solution = datos.solution;
    S.grid = datos.grid.map(row => row.map(cell => ({
      v: cell.v,
      clue: !!cell.clue,
      notes: new Set(cell.notes || [])
    })));
    S.cluesOriginales = new Set(datos.cluesOriginales || []);
    S.startTime = datos.startTime || Date.now();
    S.moves = datos.moves || 0;
    S.hints = datos.hints || 0;
    S.checks = datos.checks || 0;
    S.finished = false;
    S.history = datos.history || [];
    S.ultimoMovimiento = datos.ultimoMovimiento || null;
    S.selected = datos.selected || null;
    S.notesMode = !!datos.notesMode;
    S.flashDigit = null;
    S.rojo = datos.rojo || null;
    if (S.timerId) clearInterval(S.timerId);
    S.timerId = setInterval(() => UI.renderTime(), 1000);
    UI.renderBoard();
    UI.renderKeypad();
    UI.renderTime();
    UI.updateUndo();
    UI.updateHintBtn();
    UI.updateCheckBtn();
    UI.syncNotesBtn();
    document.getElementById('board').classList.remove('solved');
  },

  select(r, c) {
    if (S.finished) return;
    const cell = S.grid[r][c];
    if (cell.clue) return;
    if (S.selected && S.selected.r === r && S.selected.c === c) {
      S.selected = null; SOUND.select();
      UI.renderBoard(); UI.renderKeypad();
      return;
    }
    S.selected = { r, c };
    SOUND.select();
    UI.renderBoard(); UI.renderKeypad();
    pideGuardado();
  },

  toggleNotes() {
    S.notesMode = !S.notesMode;
    UI.syncNotesBtn();
    SOUND.select();
    if (S.notesMode) UI.toast(I18N.t('toast_notes_on'));
    pideGuardado();
  },

  place(d) {
    if (!S.selected || S.finished) return;
    const { r, c } = S.selected;
    const cell = S.grid[r][c];
    if (cell.clue) return;

    if (S.notesMode) {
      if (cell.v !== null) return;
      if (!cell.notes) cell.notes = new Set();
      if (cell.notes.has(d)) cell.notes.delete(d);
      else cell.notes.add(d);
      SOUND.note();
      UI.renderBoard(); UI.renderKeypad();
      pideGuardado();
      return;
    }

    if (!BLOTTUKU.puedeIr(S.grid, r, c, d)) {
      SOUND.error();
      UI.toast(I18N.t('toast_cant_place'));
      return;
    }
    const prev = cell.v;
    if (prev === d) return;
    cell.v = d;
    cell.notes = new Set();
    this._clearNotes(r, c, d);
    S.history.push({ r, c, prev, prevNotes: null, prevClue: cell.clue, eraPista: false });
    S.moves++;
    S.flashDigit = d;
    S.ultimoMovimiento = { r, c };
    S.rojo = null;
    SOUND.place();

    let next = null;
    for (let cc = c + 1; cc < N_COLS; cc++) {
      if (!S.grid[r][cc].clue && S.grid[r][cc].v === null) { next = { r, c: cc }; break; }
    }
    if (!next) {
      outer:
      for (let rr = r + 1; rr < N_ROWS; rr++)
        for (let cc = 0; cc < N_COLS; cc++)
          if (!S.grid[rr][cc].clue && S.grid[rr][cc].v === null) { next = { r: rr, c: cc }; break outer; }
    }
    if (!next) {
      outer2:
      for (let rr = 0; rr < N_ROWS; rr++)
        for (let cc = 0; cc < N_COLS; cc++)
          if (!S.grid[rr][cc].clue && S.grid[rr][cc].v === null) { next = { r: rr, c: cc }; break outer2; }
    }
    S.selected = next;

    UI.renderBoard();
    UI.renderKeypad();
    UI.updateUndo();
    pideGuardado();

    UI.pulsar(UI.cells[r + ',' + c], 'pop', 400);
    if (BLOTTUKU.resuelto(S.grid)) setTimeout(() => this.win(), 300);
  },

  _clearNotes(r, c, d) {
    for (let cc = 0; cc < N_COLS; cc++) {
      if (cc === c) continue;
      const cell = S.grid[r][cc];
      if (cell.notes && cell.notes.has(d)) cell.notes.delete(d);
    }
    for (let rr = 0; rr < N_ROWS; rr++) {
      if (rr === r) continue;
      const cell = S.grid[rr][c];
      if (cell.notes && cell.notes.has(d)) cell.notes.delete(d);
    }
  },

  clear() {
    if (!S.selected || S.finished) return;
    const { r, c } = S.selected;
    const cell = S.grid[r][c];
    if (cell.clue) return;

    if (S.notesMode) {
      if (cell.notes && cell.notes.size) {
        S.history.push({
          r, c, prev: cell.v, prevNotes: Array.from(cell.notes),
          prevClue: cell.clue, eraPista: false
        });
        cell.notes = new Set();
        SOUND.clear();
        UI.renderBoard();
        pideGuardado();
      }
      return;
    }

    if (cell.v === null) return;
    S.history.push({
      r, c, prev: cell.v, prevNotes: null,
      prevClue: cell.clue, eraPista: false
    });
    cell.v = null;
    S.rojo = null;
    SOUND.clear();
    UI.renderBoard(); UI.renderKeypad(); UI.updateUndo();
    pideGuardado();
  },

  undo() {
    if (!S.history.length || S.finished) return;
    const h = S.history.pop();
    const cell = S.grid[h.r][h.c];
    if (h.eraPista) { S.hints = Math.max(0, S.hints - 1); UI.updateHintBtn(true); }
    cell.v = h.prev;
    cell.notes = new Set(h.prevNotes || []);
    if (h.prevClue !== undefined) cell.clue = h.prevClue;
    S.rojo = null;
    S.selected = { r: h.r, c: h.c };
    SOUND.clear();
    UI.renderBoard(); UI.renderKeypad(); UI.updateUndo();
    pideGuardado();
  },

  _limpiaParaPista(r, c) {
    const limpiadas = [];
    for (let cc = 0; cc < N_COLS; cc++) {
      if (cc === c) continue;
      const cell = S.grid[r][cc];
      if (cell.clue) continue;
      if (cell.v !== null && cell.v !== S.solution[r][cc]) {
        limpiadas.push({ r, c: cc, prev: cell.v, notes: Array.from(cell.notes || []) });
        cell.v = null;
        cell.notes = new Set();
      }
    }
    for (let rr = 0; rr < N_ROWS; rr++) {
      if (rr === r) continue;
      const cell = S.grid[rr][c];
      if (cell.clue) continue;
      if (cell.v !== null && cell.v !== S.solution[rr][c]) {
        limpiadas.push({ r: rr, c, prev: cell.v, notes: Array.from(cell.notes || []) });
        cell.v = null;
        cell.notes = new Set();
      }
    }
    return limpiadas;
  },

  hint() {
    if (S.finished) return;

    if (this.hintsLeft() <= 0) {
      SOUND.denied();
      UI.toast(I18N.t('toast_no_hints', { diff: diffName(S.difficulty) }));
      UI.updateHintBtn();
      return;
    }

    const vacias = [];
    for (let r = 0; r < N_ROWS; r++)
      for (let c = 0; c < N_COLS; c++) {
        const cell = S.grid[r][c];
        if (cell.clue) continue;
        if (cell.v !== null) continue;
        const valor = S.solution[r][c];
        const cands = BLOTTUKU.candidatos(S.grid, r, c).length;
        vacias.push({ r, c, valor, cands });
      }

    if (!vacias.length) {
      UI.toast(I18N.t('toast_board_ok'));
      return;
    }

    let mejor = vacias[0];
    for (let i = 1; i < vacias.length; i++)
      if (vacias[i].cands < mejor.cands) mejor = vacias[i];
    const empatadas = vacias.filter(x => x.cands === mejor.cands);
    const h = empatadas[(Math.random() * empatadas.length) | 0];

    const razon = this._razon(h.r, h.c);

    const limpiadas = this._limpiaParaPista(h.r, h.c);

    for (const l of limpiadas) {
      S.history.push({
        r: l.r, c: l.c,
        prev: l.prev,
        prevNotes: l.notes,
        prevClue: false,
        eraPista: false
      });
    }

    const cell = S.grid[h.r][h.c];
    S.history.push({
      r: h.r, c: h.c,
      prev: cell.v,
      prevNotes: Array.from(cell.notes || []),
      prevClue: cell.clue,
      eraPista: true
    });

    cell.v = h.valor;
    cell.notes = new Set();
    cell.clue = true;
    this._clearNotes(h.r, h.c, h.valor);
    S.rojo = null;

    S.hints++;
    S.moves++;
    S.ultimoMovimiento = { r: h.r, c: h.c };
    SOUND.hint();
    S.selected = null;

    UI.renderBoard(); UI.renderKeypad(); UI.updateUndo(); UI.updateHintBtn(true);
    pideGuardado();

    UI.pulsar(UI.cells[h.r + ',' + h.c], 'hint-pop', 950);
    for (const l of limpiadas) {
      UI.pulsar(UI.cells[l.r + ',' + l.c], 'clear-pop', 600);
    }
    if (limpiadas.length) SOUND.conflict();

    const restantes = this.hintsLeft();
    const cola = restantes > 0
      ? I18N.t('toast_hint_remaining', { n: restantes, max: this.maxHints() })
      : I18N.t('toast_hint_last');
    const colaLimpieza = limpiadas.length
      ? I18N.t('toast_hint_cleared', { n: limpiadas.length })
      : '';
    UI.toast(I18N.t('toast_hint_placed', { v: h.valor, reason: razon }) + colaLimpieza + cola);
    if (BLOTTUKU.resuelto(S.grid)) setTimeout(() => this.win(), 500);
  },

  _vecinasFijas(r, c) {
    let fila = 0, col = 0;
    for (let cc = 0; cc < N_COLS; cc++) {
      if (cc === c) continue;
      if (S.grid[r][cc].clue) fila++;
    }
    for (let rr = 0; rr < N_ROWS; rr++) {
      if (rr === r) continue;
      if (S.grid[rr][c].clue) col++;
    }
    return { fila, col };
  },

  check() {
    if (S.finished) return;

    if (this.checksLeft() <= 0) {
      SOUND.denied();
      UI.toast(I18N.t('toast_no_checks', { diff: diffName(S.difficulty) }));
      UI.updateCheckBtn();
      return;
    }

    const utiles = [];
    const incorrectas = [];
    let hayCorrecta = false;

    for (let r = 0; r < N_ROWS; r++) {
      for (let c = 0; c < N_COLS; c++) {
        const cell = S.grid[r][c];
        if (cell.clue) continue;
        if (cell.v === null) continue;

        if (cell.v === S.solution[r][c]) {
          hayCorrecta = true;
          const vec = this._vecinasFijas(r, c);
          const trivial = (vec.fila >= 2) || (vec.col >= 8);
          if (!trivial) utiles.push({ r, c, v: cell.v, peso: vec.fila * 3 + vec.col });
        } else {
          incorrectas.push({ r, c, v: cell.v });
        }
      }
    }

    if (utiles.length) {
      let maxPeso = 0;
      for (const u of utiles) if (u.peso > maxPeso) maxPeso = u.peso;
      const top = utiles.filter(u => u.peso === maxPeso);
      const h = top[(Math.random() * top.length) | 0];

      const cell = S.grid[h.r][h.c];
      S.history = S.history.filter(e => !(e.r === h.r && e.c === h.c));
      cell.clue = true;
      cell.notes = new Set();
      this._clearNotes(h.r, h.c, h.v);

      S.checks++;
      S.moves++;
      S.rojo = null;
      S.ultimoMovimiento = { r: h.r, c: h.c };
      SOUND.check();
      S.selected = null;

      UI.renderBoard(); UI.renderKeypad(); UI.updateUndo(); UI.updateCheckBtn(true);
      pideGuardado();
      UI.pulsar(UI.cells[h.r + ',' + h.c], 'hint-pop', 950);

      const restantes = this.checksLeft();
      const cola = restantes > 0
        ? I18N.t('toast_check_remaining', { n: restantes, max: this.maxChecks() })
        : I18N.t('toast_check_last');
      UI.toast(I18N.t('toast_check_placed', { v: h.v }) + cola);
      if (BLOTTUKU.resuelto(S.grid)) setTimeout(() => this.win(), 500);
      return;
    }

    if (incorrectas.length) {
      const h = incorrectas[(Math.random() * incorrectas.length) | 0];

      S.checks++;
      S.moves++;
      S.rojo = h.r + ',' + h.c;
      S.ultimoMovimiento = { r: h.r, c: h.c };
      SOUND.checkRed();
      S.selected = null;

      UI.renderBoard(); UI.renderKeypad(); UI.updateUndo(); UI.updateCheckBtn(true);
      pideGuardado();

      UI.pulsar(UI.cells[h.r + ',' + h.c], 'wrong-pop', 850);

      const restantes = this.checksLeft();
      const cola = restantes > 0
        ? I18N.t('toast_check_red_remaining', { n: restantes, max: this.maxChecks() })
        : I18N.t('toast_check_red_last');
      UI.toast(I18N.t('toast_check_red') + cola);
      return;
    }

    SOUND.denied();
    if (hayCorrecta) UI.toast(I18N.t('toast_check_trivial'));
    else UI.toast(I18N.t('toast_check_none'));
    UI.updateCheckBtn();
  },

  _razon(r, c) {
    const e = BLOTTUKU.explicar(S.grid, r, c);
    if (e.clave === 'col')  return I18N.t('exp_col');
    if (e.clave === 'row')  return I18N.t('exp_row', { sum: e.suma, rem: e.queda });
    if (e.clave === 'only') return I18N.t('exp_only');
    return I18N.t('exp_deduce');
  },

  win() {
    if (S.finished) return;
    S.finished = true;
    if (S.timerId) { clearInterval(S.timerId); S.timerId = null; }
    const elapsed = Math.floor((Date.now() - S.startTime) / 1000);

    /* Puntuación y récord */
    const score = SCORE.calcular(S.difficulty, S.hints, S.checks);
    const isNewRecord = STORE.saveRecord(S.difficulty, score);
    const prevRecord = isNewRecord ? 0 : STORE.recordOf(S.difficulty);

    SOUND.win();
    document.getElementById('board').classList.add('solved');
    UI.confetti();
    STORE.addWin({
      ts: Date.now(),
      difficulty: S.difficulty,
      time: elapsed,
      moves: S.moves,
      hints: S.hints,
      checks: S.checks,
      score,
      record: isNewRecord
    });
    STORE.limpiarPartida();
    setTimeout(() => UI.showWin(elapsed, score, isNewRecord, prevRecord), 600);
  }
};

/* ==========================================================================
   UI
   ========================================================================== */
const UI = {
  cells: {},
  keys: {},
  el(id) { return document.getElementById(id); },

  pulsar(el, cls, ms) {
    if (!el) return;
    const key = '_pulso_' + cls;
    if (el[key]) { clearTimeout(el[key]); el[key] = 0; }
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    el[key] = setTimeout(() => { el.classList.remove(cls); el[key] = 0; }, ms || 1000);
  },

  init() {
    const stored = STORE.load();
    if (stored.lang && I18N.LANGS.indexOf(stored.lang) >= 0) I18N.set(stored.lang);
    else I18N.set(I18N.detect());

    this.buildBoard();
    this.buildKeypad();
    this.bindEvents();
    this.applySoundState();
    this.applyI18n();

    const partida = STORE.cargarPartida();
    if (partida && partida.solution && partida.grid) {
      GAME.restaurar(partida);
    } else {
      GAME.nueva('medio');
    }

    const seen = STORE.load().tutorialSeen;
    if (!seen) setTimeout(() => this.showTut(), 500);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) guardarPartidaAhora();
    });
  },

  buildBoard() {
    const board = this.el('board');
    board.innerHTML = '';
    this.cells = {};

    const head = document.createElement('div');
    head.className = 'board-head';
    for (let c = 0; c < N_COLS; c++) {
      const col = document.createElement('div');
      col.className = 'col-head';
      col.dataset.c = c;
      for (let d = 0; d <= 8; d++) {
        const pip = document.createElement('span');
        pip.className = 'pip';
        pip.dataset.d = d;
        pip.textContent = d;
        col.appendChild(pip);
      }
      head.appendChild(col);
    }
    board.appendChild(head);

    for (let r = 0; r < N_ROWS; r++) {
      for (let c = 0; c < N_COLS; c++) {
        const cell = document.createElement('button');
        cell.className = 'cell';
        cell.type = 'button';
        cell.dataset.r = r;
        cell.dataset.c = c;
        cell.style.gridRow = String(r + 2);
        cell.style.gridColumn = String(c + 1);
        cell.setAttribute('aria-label', I18N.t('aria_row_col', { r: r + 1, c: c + 1 }));
        cell.addEventListener('click', () => this.onCellTap(r, c));
        board.appendChild(cell);
        this.cells[r + ',' + c] = cell;
      }
      const sum = document.createElement('div');
      sum.className = 'row-sum';
      sum.dataset.r = r;
      sum.style.gridRow = String(r + 2);
      sum.style.gridColumn = '4';
      board.appendChild(sum);
    }
  },

  buildKeypad() {
    const kp = this.el('keypad');
    kp.innerHTML = '';
    this.keys = {};
    for (let d = 0; d <= 8; d++) {
      const btn = document.createElement('button');
      btn.className = 'key';
      btn.type = 'button';
      btn.dataset.d = d;
      btn.innerHTML = '<span class="d">' + d + '</span><span class="count"></span>';
      btn.addEventListener('click', () => GAME.place(d));
      kp.appendChild(btn);
      this.keys[d] = btn;
    }
    const erase = document.createElement('button');
    erase.className = 'key erase';
    erase.type = 'button';
    erase.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H7L3 16l10-10 8 8-5 5"/></svg>';
    erase.setAttribute('aria-label', I18N.t('aria_erase'));
    erase.addEventListener('click', () => GAME.clear());
    kp.appendChild(erase);
    this.keys.erase = erase;
  },

  bindEvents() {
    this.el('undo-btn').addEventListener('click', () => GAME.undo());
    this.el('hint-btn').addEventListener('click', () => GAME.hint());
    this.el('check-btn').addEventListener('click', () => GAME.check());
    this.el('notes-btn').addEventListener('click', () => GAME.toggleNotes());
    this.el('restart-btn').addEventListener('click', () => {
      if (S.moves === 0 && S.hints === 0 && S.checks === 0) return;
      this.showConfirm();
    });
    this.el('confirm-no').addEventListener('click', () => this.hideConfirm());
    this.el('confirm-yes').addEventListener('click', () => {
      this.hideConfirm();
      GAME.reiniciar();
    });

    this.el('menu-btn').addEventListener('click', () => this.openMenu());
    this.el('menu-cancel').addEventListener('click', () => this.closeMenu());
    this.el('menu-start').addEventListener('click', () => {
      const active = document.querySelector('.diff-btn.active');
      const diff = active ? active.dataset.diff : 'medio';
      this.closeMenu();
      GAME.nueva(diff);
    });
    this.el('menu-help').addEventListener('click', () => { this.closeMenu(); this.showTut(); });
    this.el('tut-ok').addEventListener('click', () => { this.hideTut(); STORE.patch({ tutorialSeen: true }); });
    this.el('win-new').addEventListener('click', () => { this.hideWin(); this.openMenu(); });

    this.el('sound-btn').addEventListener('click', () => {
      const on = !SOUND.isOn();
      SOUND.toggle(on);
      STORE.patch({ sound: on });
      this.applySoundState();
      if (on) SOUND.select();
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const lang = btn.dataset.lang;
        if (I18N.LANGS.indexOf(lang) < 0) return;
        if (lang === I18N.lang) { SOUND.select(); return; }
        I18N.set(lang);
        STORE.patch({ lang });
        this.applyI18n();
        SOUND.select();
      });
    });

    document.querySelectorAll('.diff-btn').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.diff-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
      });
    });

    ['menu-overlay', 'win-overlay', 'tut-overlay', 'confirm-overlay'].forEach(id => {
      this.el(id).addEventListener('click', e => {
        if (e.target === this.el(id)) {
          if (id === 'tut-overlay') { this.hideTut(); STORE.patch({ tutorialSeen: true }); }
          else if (id === 'menu-overlay') this.closeMenu();
          else if (id === 'confirm-overlay') this.hideConfirm();
          else this.hideWin();
        }
      });
    });

    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '8') { e.preventDefault(); GAME.place(parseInt(e.key, 10)); }
      else if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); GAME.clear(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); GAME.undo(); }
      else if (e.key.toLowerCase() === 'n' && !e.ctrlKey && !e.metaKey) GAME.toggleNotes();
      else if (e.key.toLowerCase() === 'h' && !e.ctrlKey && !e.metaKey) GAME.hint();
      else if (e.key.toLowerCase() === 'k' && !e.ctrlKey && !e.metaKey) GAME.check();
      else if (e.key === 'Escape') {
        if (S.selected) { S.selected = null; UI.renderBoard(); UI.renderKeypad(); }
        else { UI.closeMenu(); UI.hideWin(); UI.hideTut(); UI.hideConfirm(); }
      }
    });
  },

  onCellTap(r, c) {
    const cell = S.grid[r][c];
    if (cell.clue) {
      this.pulsar(this.cells[r + ',' + c], 'pop', 400);
      SOUND.select();
      return;
    }
    GAME.select(r, c);
  },

  applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.dataset.i18n;
      if (k) el.textContent = I18N.t(k);
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const k = el.dataset.i18nHtml;
      if (k) el.innerHTML = I18N.t(k);
    });

    document.querySelectorAll('[data-diff-info]').forEach(el => {
      const k = el.dataset.diffInfo;
      const d = DIFFS[k];
      if (d) el.textContent = I18N.t('diff_info', {
        pistas: d.pistas, ayudas: d.ayudas, checks: d.checks, base: d.base
      });
    });

    try { document.documentElement.lang = I18N.lang; } catch (e) {}

    const setAria = (id, key, vars) => {
      const e = this.el(id);
      if (e) e.setAttribute('aria-label', I18N.t(key, vars));
    };
    setAria('sound-btn', 'aria_sound');
    setAria('menu-btn', 'aria_menu');
    setAria('undo-btn', 'aria_undo');
    setAria('notes-btn', 'aria_notes');
    setAria('restart-btn', 'aria_restart');
    if (this.keys && this.keys.erase) this.keys.erase.setAttribute('aria-label', I18N.t('aria_erase'));

    for (let r = 0; r < N_ROWS; r++)
      for (let c = 0; c < N_COLS; c++) {
        const cell = this.cells[r + ',' + c];
        if (cell) cell.setAttribute('aria-label', I18N.t('aria_row_col', { r: r + 1, c: c + 1 }));
      }

    this.updateHintBtn();
    this.updateCheckBtn();

    document.querySelectorAll('.lang-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === I18N.lang);
    });
  },

  renderBoard() {
    const conflicts = BLOTTUKU.conflictos(S.grid, S.ultimoMovimiento);
    const sel = S.selected;
    const selDigit = sel ? S.grid[sel.r][sel.c].v : null;

    for (let r = 0; r < N_ROWS; r++) {
      for (let c = 0; c < N_COLS; c++) {
        const el = this.cells[r + ',' + c];
        const cell = S.grid[r][c];
        const esRojo = (S.rojo === (r + ',' + c));

        let cls = 'cell';
        if (cell.clue) cls += ' clue';
        else if (cell.v !== null) {
          cls += ' filled';
          if (esRojo) cls += ' wrong';
        } else if (cell.notes && cell.notes.size) cls += ' notes';

        if (sel) {
          if (sel.r === r && sel.c === c) cls += ' selected';
          else if (sel.r === r) cls += ' same-row';
          else if (sel.c === c) cls += ' same-col';
        }
        if (conflicts.has(r + ',' + c)) cls += ' conflict';
        if (selDigit !== null && cell.v === selDigit && !(sel.r === r && sel.c === c)) {
          cls += ' same-digit';
        }
        el.className = cls;

        if (cell.v !== null) {
          const txt = String(cell.v);
          if (el.textContent !== txt) el.textContent = txt;
          if (el.querySelector('.notes-grid')) el.textContent = txt;
          el._notesKey = '';
        } else if (cell.notes && cell.notes.size) {
          const key = Array.from(cell.notes).sort().join('');
          if (el._notesKey !== key) {
            let html = '<div class="notes-grid">';
            for (let d = 0; d <= 8; d++) {
              html += '<span class="' + (cell.notes.has(d) ? 'on' : '') + '">' + d + '</span>';
            }
            html += '</div>';
            el.innerHTML = html;
            el._notesKey = key;
          }
        } else {
          if (el.textContent !== '' || el.querySelector('.notes-grid')) {
            el.textContent = '';
            el._notesKey = '';
          }
        }
      }

      const sumEl = document.querySelector('.row-sum[data-r="' + r + '"]');
      const { suma, huecos } = BLOTTUKU.sumaFila(S.grid, r);
      let newCls, newTxt;
      if (huecos === 0 && suma === TARGET) { newCls = 'row-sum ok';    newTxt = '12/12'; }
      else if (suma > TARGET)               { newCls = 'row-sum over';  newTxt = suma + '/12'; }
      else if (huecos === 0)                { newCls = 'row-sum under'; newTxt = suma + '/12'; }
      else                                  { newCls = 'row-sum';       newTxt = suma > 0 ? suma + '/12' : '0/12'; }
      sumEl.className = newCls;
      sumEl.textContent = newTxt;
      sumEl.dataset.state = newCls;
    }

    for (let c = 0; c < N_COLS; c++) {
      const usados = BLOTTUKU.columna(S.grid, c);
      const col = document.querySelector('.col-head[data-c="' + c + '"]');
      if (!col) continue;
      col.querySelectorAll('.pip').forEach(pip => {
        const d = +pip.dataset.d;
        pip.className = 'pip' + (usados.has(d) ? ' used' : '');
      });
    }
  },

  renderKeypad() {
    if (!S.grid.length) return;
    const counts = BLOTTUKU.globalCounts(S.grid);
    const sel = S.selected;
    const colSet = sel ? BLOTTUKU.columna(S.grid, sel.c) : null;

    const enNotas = S.notesMode && sel && S.grid[sel.r][sel.c].v === null;

    for (let d = 0; d <= 8; d++) {
      const btn = this.keys[d];
      const remaining = Math.max(0, 3 - counts[d]);
      btn.querySelector('.count').textContent = remaining > 0 ? remaining : '·';

      let disabled = false, inCol = false;
      if (enNotas) {
        disabled = false;
      } else if (counts[d] >= 3) {
        disabled = true;
      } else if (sel) {
        if (colSet.has(d)) { inCol = true; disabled = true; }
        else if (!BLOTTUKU.puedeIr(S.grid, sel.r, sel.c, d)) disabled = true;
      }

      let cls = 'key';
      if (inCol) cls += ' in-col';
      btn.className = cls;
      btn.disabled = disabled;
    }

    const erase = this.keys.erase;
    if (!sel || S.grid[sel.r][sel.c].clue) {
      erase.disabled = true;
    } else if (enNotas) {
      erase.disabled = !(S.grid[sel.r][sel.c].notes && S.grid[sel.r][sel.c].notes.size);
    } else {
      erase.disabled = S.grid[sel.r][sel.c].v === null;
    }

    if (S.flashDigit !== null) {
      const k = this.keys[S.flashDigit];
      if (k) this.pulsar(k, 'flash', 420);
      S.flashDigit = null;
    }
  },

  updateHintBtn(pulse) {
    const btn = this.el('hint-btn');
    const badge = this.el('hint-badge');
    if (!btn || !badge) return;
    const restantes = GAME.hintsLeft();
    badge.textContent = restantes > 0 ? String(restantes) : '0';
    btn.disabled = restantes <= 0 || S.finished;
    btn.setAttribute('aria-label',
      restantes > 0 ? I18N.t('aria_hint_avail', { n: restantes }) : I18N.t('aria_hint_none'));
    if (pulse) this.pulsar(btn, 'badge-pulse', 620);
  },

  updateCheckBtn(pulse) {
    const btn = this.el('check-btn');
    const badge = this.el('check-badge');
    if (!btn || !badge) return;
    const restantes = GAME.checksLeft();
    badge.textContent = restantes > 0 ? String(restantes) : '0';
    btn.disabled = restantes <= 0 || S.finished;
    btn.setAttribute('aria-label',
      restantes > 0 ? I18N.t('aria_check_avail', { n: restantes }) : I18N.t('aria_check_none'));
    if (pulse) this.pulsar(btn, 'badge-pulse', 620);
  },

  syncNotesBtn() {
    const btn = this.el('notes-btn');
    if (!btn) return;
    btn.classList.toggle('active', !!S.notesMode);
  },

  renderTime() {
    if (!S.startTime) return;
    const elapsed = Math.floor((Date.now() - S.startTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    const el = this.el('timer');
    if (el) el.textContent = m + ':' + String(s).padStart(2, '0');
  },

  updateUndo() {
    const el = this.el('undo-btn');
    if (el) el.disabled = S.history.length === 0 || S.finished;
  },

  toast(msg) {
    const t = this.el('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => t.classList.remove('show'), 2400);
  },

  openMenu() { this.el('menu-overlay').classList.add('show'); },
  closeMenu() { this.el('menu-overlay').classList.remove('show'); },
  showTut() { this.el('tut-overlay').classList.add('show'); },
  hideTut() { this.el('tut-overlay').classList.remove('show'); },
  showConfirm() { this.el('confirm-overlay').classList.add('show'); },
  hideConfirm() { this.el('confirm-overlay').classList.remove('show'); },

  /* Conteo animado de la puntuación en el modal de victoria. */
  _contarScore(hasta, ms) {
    const el = this.el('win-score');
    if (!el) return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      el.textContent = String(hasta);
      return;
    }
    const t0 = performance.now();
    const paso = () => {
      const t = Math.min(1, (performance.now() - t0) / ms);
      const v = Math.round(hasta * (1 - Math.pow(1 - t, 3)));
      el.textContent = String(v);
      if (t < 1) requestAnimationFrame(paso);
      else el.textContent = String(hasta);
    };
    requestAnimationFrame(paso);
  },

  showWin(elapsed, score, isNewRecord, prevRecord) {
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    this.el('win-time').textContent = m + ':' + String(s).padStart(2, '0');
    this.el('win-moves').textContent = S.moves;
    this.el('win-helps').textContent = (S.hints + S.checks);

    const total = S.hints + S.checks;
    const sub = total === 0
      ? I18N.t('no_help')
      : (total === 1 ? I18N.t('one_hint') : I18N.t('n_hints', { n: total }));
    this.el('win-sub').textContent = sub + ' · ' + diffName(S.difficulty);

    /* Medalla */
    const medalla = SCORE.medalla(S.hints, S.checks);
    const medalEl = this.el('win-medal');
    const medalLabel = this.el('win-medal-label');
    medalEl.classList.remove('gold','silver','bronze');
    if (medalla) {
      medalEl.hidden = false;
      medalEl.classList.add(medalla);
      medalLabel.textContent = I18N.t('medal_' + medalla);
    } else {
      medalEl.hidden = true;
    }

    /* Puntuación + récord */
    this._contarScore(score, 900);
    const recEl = this.el('win-record');
    recEl.classList.remove('new');
    if (isNewRecord) {
      recEl.textContent = I18N.t('record_beat');
      recEl.classList.add('new');
    } else {
      recEl.textContent = I18N.t('record_best', { n: prevRecord });
    }

    this.el('win-overlay').classList.add('show');
  },
  hideWin() { this.el('win-overlay').classList.remove('show'); },

  applySoundState() {
    const on = SOUND.isOn();
    const onIco = this.el('sound-on-icon');
    const offIco = this.el('sound-off-icon');
    const btn = this.el('sound-btn');
    if (onIco) onIco.style.display = on ? '' : 'none';
    if (offIco) offIco.style.display = on ? 'none' : '';
    if (btn) btn.classList.toggle('off', !on);
  },

  confetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cont = document.createElement('div');
    cont.className = 'confetti';
    document.body.appendChild(cont);
    const colores = ['#b8934d','#5d7a5d','#b8604c','#d4b478','#8fae8f'];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement('i');
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = colores[i % colores.length];
      p.style.animationDelay = (Math.random() * 0.45) + 's';
      p.style.animationDuration = (1.6 + Math.random() * 0.9) + 's';
      p.style.setProperty('--rx', (Math.random() * 720 - 360) + 'deg');
      p.style.opacity = '1';
      cont.appendChild(p);
    }
    setTimeout(() => cont.remove(), 3000);
  }
};

/* ==========================================================================
   PWA
   ========================================================================== */
(function PWA() {
  function iconSvg(size) {
    const s = size, pad = s * 0.2, inner = s - pad * 2, cell = (inner - 4) / 3;
    let cells = '';
    const pattern = ['gold','sage','gold','sage','gold','sage','gold','sage','sage'];
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
      const x = pad + c * (cell + 2), y = pad + r * (cell + 2);
      const fill = pattern[r*3+c] === 'gold' ? '#d4b478' : '#a3bca3';
      cells += '<rect x="' + x + '" y="' + y + '" width="' + cell + '" height="' + cell +
        '" rx="' + (cell * 0.22) + '" fill="' + fill + '"/>';
    }
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + s + '" height="' + s +
      '" viewBox="0 0 ' + s + ' ' + s + '">' +
      '<rect width="' + s + '" height="' + s + '" rx="' + (s * 0.22) + '" fill="#fdfaf2"/>' +
      cells + '</svg>';
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
  }

  const manifest = {
    name: 'Blottoku — Rompecabezas de Reparto',
    short_name: 'Blottoku',
    description: 'Rompecabezas de reparto con restricciones tipo sudoku',
    start_url: '.', scope: '.',
    display: 'standalone', orientation: 'portrait',
    background_color: '#fdfaf2', theme_color: '#f7f1e3', lang: 'es',
    icons: [
      { src: iconSvg(192), sizes: '192x192', type: 'image/svg+xml', purpose: 'any' },
      { src: iconSvg(512), sizes: '512x512', type: 'image/svg+xml', purpose: 'any' }
    ]
  };
  try {
    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('manifest-link').href = URL.createObjectURL(blob);
  } catch(e) {}

  if ('serviceWorker' in navigator) {
    const sw = "const C='blottoku-v19';" +
      "self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./']).catch(()=>{})));self.skipWaiting()});" +
      "self.addEventListener('activate',e=>{e.waitUntil(clients.claim())});" +
      "self.addEventListener('fetch',e=>{const u=new URL(e.request.url);if(e.request.method!=='GET'||u.origin!==location.origin)return;e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{const cp=resp.clone();caches.open(C).then(c=>c.put(e.request,cp));return resp}).catch(()=>caches.match('./'))))});";
    try {
      const blob = new Blob([sw], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    } catch(e) {}
  }
})();

/* ---------- Boot ---------- */
function _boot() {
  if (typeof window !== 'undefined' && window.BLOTTUKU_TESTS) {
    try { BLOTTUKU._selfTest(); console.log('[Blottoku] tests OK'); }
    catch (e) { console.error('[Blottoku] tests FALLAN', e); }
  }
  UI.init();
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _boot);
} else {
  _boot();
}
</script>
